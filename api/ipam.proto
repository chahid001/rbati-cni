syntax = "proto3";

package ipam;

option go_package = "./";

service IPAMService {
  rpc AllocateIP (AllocateRequest) returns (AllocateResponse);
  rpc ReleaseIP (ReleaseRequest) returns (ReleaseResponse);
}

message AllocateRequest {
  string pod = 1;
  string candidateIP = 2;
}

message AllocateResponse {
  string ip = 1;
  string mask = 2;
}

message ReleaseRequest {
  string ip = 1;
}

message ReleaseResponse {}
